<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harshat Singh | Portfolio</title>
  <style>
    /* 1. BASE STYLES & BACKGROUND */
    body {
      margin: 0;
      overflow: hidden; /* Prevents scrollbars so cards can drift cleanly */
      background: radial-gradient(circle at 50% 50%, #7d934a 0%, #1c2a15 100%); /* Green mood-board gradient */
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: white;
    }

    /* 2. TOP CORNER LINKS */
    .top-links {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 1000;
      display: flex;
      gap: 15px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .top-links a {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }
    .top-links a:hover {
      opacity: 1;
    }

    /* 3. THE CANVAS & DRIFTING CARDS */
    #canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      transition: filter 0.4s ease; /* Smooth blur transition */
    }
    
    .is-blurred {
      filter: blur(10px);
      pointer-events: none; /* Prevents clicking cards in the background */
    }

    .card {
      position: absolute;
      width: 180px; /* Small base size */
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      will-change: transform, left, top;
    }
    
    .card img, .card video {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Hover "Floating" Effect */
    .card:hover {
      transform: scale(1.08);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      z-index: 100 !important; /* Brings hovered card to the absolute front */
    }

    /* 4. EXPANDED MODAL OVERLAY */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .expanded-content img, .expanded-content video {
      max-width: 85vw;
      max-height: 85vh;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- Navigation Links -->
  <nav class="top-links">
    <a href="https://www.linkedin.com/in/harshatsingh" target="_blank">[ li ]</a>
    <a href="https://www.legalbysoka.com" target="_blank">[ soka ]</a>
  </nav>

  <!-- Drifting Canvas -->
  <div id="canvas"></div>

  <!-- Click/Expand Overlay -->
  <div id="overlay" class="hidden">
    <div class="expanded-content" id="expanded-content"></div>
  </div>

  <script>
    // --- YOUR CONTENT DATA FILE ---
    // Easily add new writings, drafts, or UI wireframes here.
    const portfolioData = [
      { type: 'image', src: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500', link: '' },
      { type: 'image', src: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=500', link: '' },
      { type: 'image', src: 'https://images.unsplash.com/photo-1588345921523-c2dcdb7f1dcd?q=80&w=500', link: '' },
      { type: 'image', src: 'https://images.unsplash.com/photo-1524169358666-79f22534bc6e?q=80&w=500', link: '' },
      { type: 'image', src: 'https://images.unsplash.com/photo-1606170033648-5d55a3edf314?q=80&w=500', link: '' }
    ];

    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const expandedContent = document.getElementById('expanded-content');
    
    let cards = [];
    let isGlobalPaused = false; // Controls the main drift freeze

    // --- 1. GENERATE & PLACE CARDS ---
    portfolioData.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `<img src="${item.src}" alt="Portfolio Cover">`;
      
      // Randomize starting positions
      const cardWidth = 180;
      let x = Math.random() * (window.innerWidth - cardWidth);
      let y = Math.random() * (window.innerHeight - 250);
      
      // Randomize drift speed and direction
      let vx = (Math.random() - 0.5) * 1.2; 
      let vy = (Math.random() - 0.5) * 1.2;

      el.style.left = x + 'px';
      el.style.top = y + 'px';
      
      // Stagger z-index slightly so they overlap nicely
      el.style.zIndex = Math.floor(Math.random() * 10);
      
      canvas.appendChild(el);

      // --- INTERACTION LOGIC ---
      let isHovered = false;
      
      // Pause individual card on hover
      el.addEventListener('mouseenter', () => isHovered = true);
      el.addEventListener('mouseleave', () => isHovered = false);

      // Expand card on click
      el.addEventListener('click', () => {
        isGlobalPaused = true;
        canvas.classList.add('is-blurred');
        overlay.classList.remove('hidden');
        
        if (item.type === 'image') {
          expandedContent.innerHTML = `<img src="${item.src}">`;
        } 
        // Logic for external links can be added here
      });

      cards.push({ el, x, y, vx, vy, isHovered, cardWidth });
    });

    // --- 2. THE CONTINUOUS DRIFT ANIMATION ---
    function animate() {
      if (!isGlobalPaused) {
        cards.forEach(card => {
          if (!card.isHovered) {
            // Move card
            card.x += card.vx;
            card.y += card.vy;

            // Bounce smoothly off the edges of the screen
            if (card.x <= 0 || card.x >= window.innerWidth - card.cardWidth) card.vx *= -1;
            if (card.y <= 0 || card.y >= window.innerHeight - (card.cardWidth * 1.4)) card.vy *= -1;

            card.el.style.left = card.x + 'px';
            card.el.style.top = card.y + 'px';
          }
        });
      }
      requestAnimationFrame(animate); // Loops the animation natively
    }
    
    // Start animation loop
    animate();

    // --- 3. CLOSE EXPANDED VIEW ---
    overlay.addEventListener('click', () => {
      isGlobalPaused = false;
      canvas.classList.remove('is-blurred');
      overlay.classList.add('hidden');
      
      // Clear content to stop videos from playing in background
      setTimeout(() => { expandedContent.innerHTML = ''; }, 400);
    });

  </script>
</body>
</html>
