<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Image Sphere</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* WebGL Canvas */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      transition: filter 0.5s ease;
    }

    #canvas-container.blurred {
      filter: blur(12px) brightness(0.4);
    }

    /* Overlay UI */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
    }

    .header, .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .hint {
      font-size: 0.8rem;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Focus Modal Overlay */
    #overlay-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
    }

    #overlay-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      text-align: center;
      max-width: 400px;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transform: translateY(20px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #overlay-modal.active .modal-content {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .modal-desc {
      font-size: 0.85rem;
      color: #a0a0a0;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .close-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #cccccc;
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <div class="header">
      <div class="brand">Sphere Canvas</div>
      <div class="hint">Drag to rotate / Click card to focus</div>
    </div>
    <div class="footer">
      <div class="hint">Scroll to zoom</div>
    </div>
  </div>

  <div id="overlay-modal">
    <div class="modal-content">
      <h2 class="modal-title" id="modal-title">Item Title</h2>
      <p class="modal-desc" id="modal-desc">Detailed metadata or image description can go here.</p>
      <button class="close-btn" id="close-btn">Return to Sphere</button>
    </div>
  </div>

  <script>
    // --- Configuration ---
    const TOTAL_CARDS = 42;
    const SPHERE_RADIUS = 18;
    const CARD_WIDTH = 3.5;
    const CARD_HEIGHT = 4.5;

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 42;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const sphereGroup = new THREE.Group();
    scene.add(sphereGroup);

    // --- Generate Sample Textures Canvas ---
    function createPlaceholderTexture(text, bgColor, textColor) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = textColor;
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 16;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);

      return new THREE.CanvasTexture(canvas);
    }

    const cards = [];
    const geometry = new THREE.PlaneGeometry(CARD_WIDTH, CARD_HEIGHT);

    // Distribute cards uniformly on sphere using Fibonacci Lattice
    const phi = (1 + Math.sqrt(5)) / 2;
    for (let i = 0; i < TOTAL_CARDS; i++) {
      const theta = 2 * Math.PI * i / phi;
      const y = 1 - (i / (TOTAL_CARDS - 1)) * 2;
      const radiusAtY = Math.sqrt(1 - y * y);
      
      const x = Math.cos(theta) * radiusAtY;
      const z = Math.sin(theta) * radiusAtY;

      const pos = new THREE.Vector3(x, y, z).multiplyScalar(SPHERE_RADIUS);

      const colorHue = (i * 25) % 360;
      const texture = createPlaceholderTexture(`Card #${i + 1}`, `hsl(${colorHue}, 40%, 20%)`, `hsl(${colorHue}, 80%, 80%)`);
      
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(pos);
      
      // Orient card facing outward from center
      mesh.lookAt(pos.clone().multiplyScalar(2));

      mesh.userData = {
        id: i + 1,
        title: `Project Item #${i + 1}`,
        desc: `Description for element ${i + 1} positioned in the 3D matrix.`,
        basePosition: pos.clone(),
        baseRotation: mesh.rotation.clone()
      };

      sphereGroup.add(mesh);
      cards.push(mesh);
    }

    // --- Interaction Mechanics ---
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotationVelocity = { x: 0.001, y: 0.002 };
    let isFocused = false;
    let selectedMesh = null;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Mouse & Touch Controls
    window.addEventListener('mousedown', (e) => {
      if (isFocused) return;
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (!isDragging || isFocused) return;

      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;

      rotationVelocity.y = deltaX * 0.0005;
      rotationVelocity.x = deltaY * 0.0005;

      sphereGroup.rotation.y += rotationVelocity.y;
      sphereGroup.rotation.x += rotationVelocity.x;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Zoom on Scroll
    window.addEventListener('wheel', (e) => {
      if (isFocused) return;
      camera.position.z += e.deltaY * 0.02;
      camera.position.z = Math.max(25, Math.min(70, camera.position.z));
    });

    // Click Detection / Selection
    window.addEventListener('click', (e) => {
      if (isFocused) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cards);

      if (intersects.length > 0) {
        focusCard(intersects[0].object);
      }
    });

    // --- Focus & Overlay Handlers ---
    const modal = document.getElementById('overlay-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const closeBtn = document.getElementById('close-btn');

    function focusCard(mesh) {
      isFocused = true;
      selectedMesh = mesh;

      modalTitle.innerText = mesh.userData.title;
      modalDesc.innerText = mesh.userData.desc;

      container.classList.add('blurred');
      modal.classList.add('active');
    }

    function resetFocus() {
      isFocused = false;
      selectedMesh = null;

      container.classList.remove('blurred');
      modal.classList.remove('active');
    }

    closeBtn.addEventListener('click', resetFocus);

    // --- Render Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // Continuous rotation momentum when not dragging/focused
      if (!isDragging && !isFocused) {
        sphereGroup.rotation.y += rotationVelocity.y;
        sphereGroup.rotation.x += rotationVelocity.x;

        // Friction inertia
        rotationVelocity.x *= 0.95;
        rotationVelocity.y *= 0.95;

        // Maintain minimum ambient drift
        if (Math.abs(rotationVelocity.x) < 0.0005) rotationVelocity.x = 0.0003;
        if (Math.abs(rotationVelocity.y) < 0.0005) rotationVelocity.y = 0.0005;
      }

      renderer.render(scene, camera);
    }

    animate();

    // Responsive Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
